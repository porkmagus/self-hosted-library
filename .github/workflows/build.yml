name: Verify, build, and publish

on:
  push:
    tags: ['v*']
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/self-hosted-library

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Test and statically check backend
        working-directory: api
        run: |
          uv run --python 3.13 --with-requirements requirements-dev.txt pytest -q
          uv run --python 3.13 --with-requirements requirements-dev.txt ruff check api tests migrations
          uv run --python 3.13 --with-requirements requirements-dev.txt ruff format --check api tests migrations
          uv run --python 3.13 --with-requirements requirements-dev.txt mypy api
      - name: Audit Python dependencies
        working-directory: api
        run: uvx pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      # setup-node's tool cache is runner-local; no package-manager cache or artifact crosses jobs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
      - name: Test, typecheck, build, and audit frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm audit --audit-level=high

  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate shell and Compose surfaces
        run: |
          bash -n setup.sh doctor.sh reset.sh backup.sh restore.sh upgrade.sh
          cp .env.example .env
          mkdir -p .state
          printf '{"identities":[]}\n' > .state/seaweedfs-s3.json
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet

  build:
    needs: [backend, frontend, lifecycle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract immutable release metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and publish tagged releases
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
