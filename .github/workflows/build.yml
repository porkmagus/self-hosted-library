name: Verify, build, and publish

on:
  push:
    tags: ['v*']
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/self-hosted-library

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Test and statically check backend
        working-directory: api
        run: |
          uv run --python 3.13 --with-requirements requirements-dev.txt pytest -q
          uv run --python 3.13 --with-requirements requirements-dev.txt ruff check api tests migrations
          uv run --python 3.13 --with-requirements requirements-dev.txt ruff format --check api tests migrations
          uv run --python 3.13 --with-requirements requirements-dev.txt mypy api
      - name: Audit Python dependencies
        working-directory: api
        run: uvx pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-node's tool cache is runner-local; no package-manager cache or artifact crosses jobs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4 zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
      - name: Test, typecheck, build, and audit frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
          npm audit --audit-level=high

  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate shell and Compose surfaces
        run: |
          bash -n setup.sh doctor.sh reset.sh backup.sh restore.sh upgrade.sh
          cp .env.example .env
          mkdir -p .state
          printf '{"identities":[]}\n' > .state/seaweedfs-s3.json
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet

  build:
    needs: [backend, frontend, lifecycle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract immutable release metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and publish tagged releases
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
