# Local source-build overlay. Production setup uses only compose.yaml.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-hosted-library:dev
    volumes:
      - ${GRIMOIRE_DATA:-/home/sean/grimoire-data}:/app/data
      - ${HOME}/grimoire/models:/app/models:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-hosted-library:dev
    volumes:
      - ${GRIMOIRE_DATA:-/home/sean/grimoire-data}:/app/data

  worker_registration:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-hosted-library:dev

  worker_high:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-hosted-library:dev

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-hosted-library:dev
    volumes:
      - ${GRIMOIRE_DATA:-/home/sean/grimoire-data}:/app/data

  embedding_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-hosted-library:dev

  ocr_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: self-hosted-library:dev
