# GPU acceleration overlay — merged with compose.yaml by setup.sh when NVIDIA GPU detected
# Usage: docker compose -f compose.yaml -f compose.gpu.yaml up -d

services:
  embedding_server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ocr_server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
