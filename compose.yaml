# Production stack: pinned prebuilt application image, private dependencies.
# Local source builds use: docker compose -f compose.yaml -f compose.dev.yaml ...

networks:
  library:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  seaweedfs_data:
  ollama_data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-library_documents}
  IMAGE_COLLECTION: ${IMAGE_COLLECTION:-library_images}
  IMAGE_SEARCH_MIN_SCORE: ${IMAGE_SEARCH_MIN_SCORE:-0.2}
  EMBED_MODEL: ${EMBED_MODEL:-bge-large}
  EMBED_DIMENSION: ${EMBED_DIMENSION:-1024}
  S3_ENDPOINT: ${S3_ENDPOINT:-seaweedfs:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-library-files}
  EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-512}
  EMBED_BATCH_DELAY: ${EMBED_BATCH_DELAY:-0.0}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
  # PDF OCR tunables (shared by app + workers + OCR server)
  PDF_OCR_DPI: ${PDF_OCR_DPI:-200}
  PDF_OCR_MAX_INPUT_BYTES: ${PDF_OCR_MAX_INPUT_BYTES:-524288000}
  PDF_OCR_MAX_PAGES: ${PDF_OCR_MAX_PAGES:-1000}
  PDF_OCR_MAX_PAGE_PIXELS: ${PDF_OCR_MAX_PAGE_PIXELS:-100000000}
  PDF_OCR_MAX_OUTPUT_BYTES: ${PDF_OCR_MAX_OUTPUT_BYTES:-104857600}
  PDF_OCR_MAX_MEMORY_BYTES: ${PDF_OCR_MAX_MEMORY_BYTES:-4294967296}
  PDF_OCR_MAX_CPU_SECONDS: ${PDF_OCR_MAX_CPU_SECONDS:-900}
  PDF_OCR_TIMEOUT_SECONDS: ${PDF_OCR_TIMEOUT_SECONDS:-600}
  # OCR server tunables
  OCR_USE_GPU: ${OCR_USE_GPU:-false}
  OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
  # Force single-threaded CPU backends so OCR doesn't starve search workers
  OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
  MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
  OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
  NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
  VECLIB_MAXIMUM_THREADS: ${VECLIB_MAXIMUM_THREADS:-1}
  PYTHONUNBUFFERED: "1"

x-app-image: &app-image
  image: ghcr.io/porkmagus/self-hosted-library:${APP_VERSION:-v1.0.0}
  env_file: [.env]
  environment:
    <<: *api-env
  networks: [library]
  logging: *default-logging
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]


services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    logging: *default-logging
    networks: [library]
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [library]
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.8.0-alpine
    restart: unless-stopped
    logging: *default-logging
    networks: [library]
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    restart: unless-stopped
    logging: *default-logging
    networks: [library]
    volumes:
      - seaweedfs_data:/data
      - ${SEAWEEDFS_S3_CONFIG_PATH:-./.state/seaweedfs-s3.json}:/etc/seaweedfs/s3.json:ro
    command: ["mini", "-dir=/data", "-s3.config=/etc/seaweedfs/s3.json", "-master.telemetry=false"]
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/); [ \"$$code\" = 200 ] || [ \"$$code\" = 403 ]"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: ollama/ollama:0.12.10
    profiles: ["ollama"]
    restart: unless-stopped
    logging: *default-logging
    networks: [library]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

  ocr_server:
    <<: *app-image
    command: ["uvicorn", "api.services.ocr_server:app", "--host", "0.0.0.0", "--port", "8002", "--workers", "1"]
    environment:
      <<: *api-env
      OCR_SERVER_URL: "http://localhost:8002"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  embedding_server:
    <<: *app-image
    command: ["uvicorn", "api.services.embedding_server:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    environment:
      <<: *api-env
      EMBEDDING_SERVER_URL: "http://localhost:8001"
      OCR_SERVER_URL: "http://ocr_server:8002"
    depends_on:
      postgres: {condition: service_healthy}
      ocr_server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  app:
    <<: *app-image
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
      embedding_server: {condition: service_healthy}
    environment:
      <<: *api-env
      EMBEDDING_SERVER_URL: "http://embedding_server:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s

  worker:
    <<: *app-image
    command: ["celery", "-A", "api.tasks.celery_app", "worker", "--loglevel=info", "--autoscale=${WORKER_AUTOSCALE_MAX:-8},1", "--pool=prefork", "--queues=ingestion"]
    environment:
      <<: *api-env
      EMBEDDING_SERVER_URL: "http://embedding_server:8001"
      OCR_SERVER_URL: "http://ocr_server:8002"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
      embedding_server: {condition: service_healthy}
      ocr_server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.tasks.celery_app inspect ping -d celery@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

  worker_registration:
    <<: *app-image
    command: ["celery", "-A", "api.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--pool=prefork", "--queues=registration"]
    volumes:
      - ${GRIMOIRE_DATA:-/home/sean/grimoire-data}:/app/data
    environment:
      <<: *api-env
      EMBEDDING_SERVER_URL: "http://embedding_server:8001"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
      embedding_server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.tasks.celery_app inspect ping -d celery@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

  worker_high:
    <<: *app-image
    command: ["celery", "-A", "api.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4", "--pool=prefork", "--queues=high"]
    environment:
      <<: *api-env
      EMBEDDING_SERVER_URL: "http://embedding_server:8001"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
      embedding_server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.tasks.celery_app inspect ping -d celery@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

  beat:
    <<: *app-image
    command: ["celery", "-A", "api.tasks.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from pathlib import Path; command=Path('/proc/1/cmdline').read_bytes().replace(b'\\0', b' '); assert b'celery' in command and b'beat' in command\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
