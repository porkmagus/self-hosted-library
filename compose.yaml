# Self-hosted library stack — CPU-safe baseline
# GPU acceleration: add compose.gpu.yaml overlay (auto-detected by setup.sh)
# restart: unless-stopped => containers return after host reboot
# healthchecks + depends_on conditions => ordered ready start

networks:
  library:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  OLLAMA_URL: ${OLLAMA_URL}
  QDRANT_URL: ${QDRANT_URL}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-library_documents}
  IMAGE_COLLECTION: ${IMAGE_COLLECTION:-library_images}
  EMBED_MODEL: ${EMBED_MODEL:-bge-large}
  EMBED_DIMENSION: ${EMBED_DIMENSION:-1024}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-library-files}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
  DATA_DIR: ${DATA_DIR:-/app/data}
  EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-512}
  EMBED_BATCH_DELAY: ${EMBED_BATCH_DELAY:-0.0}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 512M
    networks: [library]
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 64M
    networks: [library]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 32M
    networks: [library]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M
    networks: [library]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *default-logging
    networks: [library]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-8}
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: self-hosted-library-api:local
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    networks: [library]
    ports:
      - "127.0.0.1:8000:8000"
    env_file: [.env]
    environment:
      <<: *api-env
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: self-hosted-library-api:local
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 512M
    networks: [library]
    env_file: [.env]
    environment:
      <<: *api-env
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    command: celery -A api.tasks.celery_app worker --loglevel=info --concurrency=8 --pool=prefork
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.tasks.celery_app inspect ping -d celery@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: self-hosted-library-web:local
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 32M
    networks: [library]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
