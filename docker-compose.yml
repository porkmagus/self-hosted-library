# Self-hosted library stack — extracted baseline
# restart: unless-stopped => containers return after host reboot (Docker enabled on boot)
# healthchecks + depends_on conditions => ordered ready start
# Memory limits sized for ~15Gi host (api/worker/ollama take most headroom)

networks:
  grimoire:
    driver: bridge

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  OLLAMA_URL: ${OLLAMA_URL}
  QDRANT_URL: ${QDRANT_URL}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-library_documents}
  EMBED_MODEL: ${EMBED_MODEL:-bge-large}
  EMBED_DIMENSION: ${EMBED_DIMENSION:-1024}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-library-files}
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
  DATA_DIR: ${DATA_DIR:-/app/data}
  EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-512}
  EMBED_BATCH_DELAY: ${EMBED_BATCH_DELAY:-0.0}
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

services:
  qdrant:
    image: qdrant/qdrant@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    container_name: grimoire-qdrant
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 512M
    networks: [grimoire]
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    container_name: grimoire-postgres
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 64M
    networks: [grimoire]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grimoire}
      POSTGRES_USER: ${POSTGRES_USER:-grimoire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: grimoire-redis
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 32M
    networks: [grimoire]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: grimoire-minio
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 128M
    networks: [grimoire]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: ollama/ollama@sha256:f1a705f2bd113fb8d15f85f7c217f0dc5f6bebda6b0cc42b82c3ad165ffcb9dc
    container_name: grimoire-ollama
    restart: unless-stopped
    logging: *default-logging
    networks: [grimoire]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-8}
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 512M
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: grimoire-api:local
    container_name: grimoire-api
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
    networks: [grimoire]
    ports:
      - "127.0.0.1:8000:8000"
    env_file: [.env]
    environment:
      <<: *api-env
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 40s

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: grimoire-api:local
    container_name: grimoire-worker
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 512M
    networks: [grimoire]
    env_file: [.env]
    environment:
      <<: *api-env
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    command: celery -A api.tasks.celery_app worker --loglevel=info --concurrency=8 --pool=prefork
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.tasks.celery_app inspect ping -d celery@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 45s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: grimoire-web:local
    container_name: grimoire-web
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 32M
    networks: [grimoire]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
